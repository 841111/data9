<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>班级考勤内容安全实验系统</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="bg-shape bg-a"></div>
  <div class="bg-shape bg-b"></div>

  <main class="container">
    <header class="hero">
      <h1>班级考勤内容安全实验系统</h1>
      <p>人脸识别 + 活体检测 + 合照识别 + 情绪分析</p>
    </header>

    <section class="panel">
      <h2>接口配置</h2>
      <div class="row">
        <label for="apiBase">后端地址</label>
        <input id="apiBase" value="http://127.0.0.1:8000" />
        <label for="roleSelect">角色</label>
        <select id="roleSelect">
          <option value="teacher" selected>teacher</option>
          <option value="student">student</option>
        </select>
        <button id="btnHealth">健康检查</button>
      </div>
      <p id="healthText" class="hint"></p>
    </section>

    <section class="panel full-width camera-panel">
      <h2><span class="icon">📷</span> 设备采集与快照</h2>
      <div class="camera-box">
        <div>
          <p style="font-size: 12px; margin: 0 0 6px 0; color: #666;">实时摄像头</p>
          <video id="video" autoplay playsinline style="width: 100%; max-width: 280px; border-radius: 10px; border: 2px solid #999;"></video>
        </div>
        <div>
          <p style="font-size: 12px; margin: 0 0 6px 0; color: #666;">拍照预览</p>
          <canvas id="canvas" width="640" height="480" style="width: 100%; max-width: 280px; border-radius: 10px; border: 2px solid #ccc; background: #f0f0f0;"></canvas>
        </div>
      </div>
      <div class="row centered" style="margin-top: 10px;">
        <button id="btnOpenCam">开启摄像头</button>
        <button id="btnCapture">拍照/取样</button>
      </div>
    </section>

    <div class="grid-2">
      <section class="panel register-panel register-card">
        <h2><span class="icon">📝</span> 学生档案注册</h2>
        <div class="col">
          <input id="studentId" placeholder="学号 (如 2023302...)" />
          <input id="studentName" placeholder="姓名" />
          <button id="btnRegister" class="btn-secondary">提交注册</button>
          <p id="registerText" class="hint"></p>
        </div>
      </section>

      <section class="panel attendance-panel attendance-card">
        <h2><span class="icon">✔️</span> 实时签到考勤</h2>
        <div class="col">
          <input id="classroomId" value="class-A" placeholder="班级编号" />
          <button id="btnAttendance" class="btn-primary">确认身份</button>
          <div id="attendanceText" class="result-box"></div>
          <hr />
          <div class="action-bar">
            <button id="btnDownloadDaily">📥 导出已签到学生名单</button>
          </div>
        </div>
      </section>
    </div>

    <section class="panel group-panel">
      <h2><span class="icon">📸</span> 集体活动合照识别</h2>
      <div class="upload-container" id="dropZone">
        <input id="groupFile" type="file" accept="image/*" hidden />
        <div class="upload-placeholder" id="uploadPlaceholder">
          <p>点击或拖拽合照至此处</p>
          <small>支持 JPG, PNG 格式</small>
        </div>
        <div class="preview-wrapper">
          <img id="groupPreview" class="hidden" alt="group preview" />
          <div id="faceOverlay" class="overlay-container"></div>
        </div>
      </div>
      <div class="row m-top">
        <input id="activityName" value="校园活动" placeholder="请输入活动名称" />
        <button id="btnGroup" class="btn-primary">开始批量识别</button>
      </div>
      <div id="groupText" class="result-box"></div>
    </section>

    <section class="panel activity-dashboard">
      <div class="panel-header">
        <h2><span class="icon">📊</span> 班级活动与情绪洞察</h2>
        <div class="header-actions">
          <button id="btnExportAttendance" class="btn-export">📥 导出考勤全表</button>
        </div>
      </div>

      <div class="grid-2">
        <div class="report-box">
          <h3>活动参与排行</h3>
          <button id="btnActivityReport" class="btn-refresh">刷新排行</button>
          <div id="activityReportWrapper" class="scroll-box"></div>
          <div id="activityReportText" class="hidden"></div>
          <canvas id="activityChart"></canvas>
        </div>

        <div class="report-box">
          <h3>情绪分布统计</h3>
          <button id="btnEmotionReport" class="btn-refresh">刷新情绪</button>
          <div id="emotionLegend" class="emo-summary"></div>
          <canvas id="emotionChart"></canvas>
          <div id="emotionReportText" class="hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
